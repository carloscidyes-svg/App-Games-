<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0f">
<title>Improv Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0f;--s1:#141416;--s2:#1b1b1e;--s3:#222226;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#edeae3;--muted:#8a857d;--muted2:#5a564f;
  --accent:#f0c93a;--accent-bg:rgba(240,201,58,.1);--accent-border:rgba(240,201,58,.25);
  --red:#e8675a;--blue:#6fb4e8;
  --font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:11px;--r-sm:8px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --header:54px;
}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;height:100%;overflow:hidden}
button{font-family:var(--font);cursor:pointer}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* HEADER */
.header{
  height:var(--header);padding-top:var(--safe-t);
  padding-left:calc(14px + var(--safe-l));padding-right:calc(14px + var(--safe-r));
  border-bottom:1px solid var(--border);background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-shrink:0;z-index:20;
}
.header-left{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;color:#000;flex-shrink:0}
.app-name{font-size:14px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-stats{display:flex;gap:12px}
.hs{text-align:right}
.hs-n{font-family:var(--mono);font-size:14px;color:var(--accent);line-height:1}
.hs-l{font-size:9px;color:var(--muted2);letter-spacing:.07em;text-transform:uppercase;margin-top:1px}

/* PRESET BUTTONS */
.preset-bar{display:flex;gap:4px;flex-shrink:0}
.btn-preset{padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono);display:flex;align-items:center;gap:3px;white-space:nowrap}
.btn-preset:hover,.btn-preset:active{border-color:var(--accent);color:var(--accent)}
.btn-preset.saved{border-color:rgba(240,201,58,.4);color:var(--accent)}

/* LAYOUT */
.app-body{flex:1;display:flex;overflow:hidden}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:12px 12px calc(20px + var(--safe-b));}
@media(min-width:768px){.main{padding:16px 18px 20px}}

/* SIDEBAR — landscape tablet/desktop */
.sidebar{display:none;width:360px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;background:var(--s1);-webkit-overflow-scrolling:touch}
@media(min-width:768px) and (orientation:landscape){.sidebar{display:block}}
@media(min-width:1024px){.sidebar{display:block;width:400px}}

/* FILTER BAR */
.filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.filter-lbl{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;align-self:center;margin-right:2px}
.fpill{padding:4px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono);white-space:nowrap;transition:all .15s}
.fpill.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.filter-clear{padding:4px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-size:10px;font-family:var(--mono)}
.filter-clear:hover{color:var(--red);border-color:var(--red)}

/* SECTION LABEL */
.sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted2);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-count{font-family:var(--mono);font-size:9px;color:var(--muted2)}

/* ENERGY CHART */
.echart{display:flex;align-items:flex-end;gap:3px;height:28px;margin-bottom:8px}
.ecol{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0}
.efill{width:100%;border-radius:2px 2px 0 0}
.elbl{font-family:var(--mono);font-size:7px;color:var(--muted2)}

/* ADD ROW */
.add-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn-add{padding:6px 10px;border-radius:var(--r-sm);border:1px dashed var(--border2);background:transparent;color:var(--muted);font-size:11px;font-family:var(--font);display:flex;align-items:center;gap:4px;transition:color .15s,border-color .15s}
.btn-add:hover,.btn-add:active{color:var(--accent);border-color:var(--accent)}
.sort-bar{display:flex;gap:5px;align-items:center;margin-bottom:8px}
.sort-lbl{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em}
.btn-sort{padding:3px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono);transition:all .15s}
.btn-sort.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.msort-bar{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.btn-msort{padding:3px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono)}
.btn-msort.active{border-color:var(--accent);color:var(--accent)}

/* PLAYLIST */
#playlist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.empty-state{text-align:center;padding:32px 20px;color:var(--muted2);font-size:12px;border:1px dashed var(--border2);border-radius:var(--r)}

/* SLOT */
.slot-wrap{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;cursor:pointer;user-select:none;touch-action:pan-y;transition:border-color .15s,background .15s,border-radius .15s}
.slot.selected{border-color:var(--accent);background:var(--accent-bg)}
.slot.selected.expanded{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.slot.drag-over{border-color:var(--accent);background:rgba(240,201,58,.04)}
.slot.dragging{opacity:.25}
.slot.filtered-out{display:none}

/* ACCORDION DETAIL — mobile portrait only */
.slot-detail{
  display:none;
  background:var(--s1);
  border:1px solid var(--accent);
  border-top:none;
  border-radius:0 0 var(--r) var(--r);
  overflow:hidden;
  max-height:0;
  transition:max-height .3s ease;
}
.slot-detail.open{display:block;max-height:1000px}
.slot-detail-inner{padding:14px}
@media(min-width:768px) and (orientation:landscape){.slot-detail{display:none!important}}
@media(min-width:1024px){.slot-detail{display:none!important}}

.drag-handle{color:var(--muted2);font-size:13px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drag-handle:active{cursor:grabbing;color:var(--accent)}
.slot-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.slot-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.slot-why{font-size:10px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.e-bar{display:flex;gap:2px;margin-top:3px}
.e-pip{width:4px;height:9px;border-radius:2px}
.cat-pill{font-size:9px;padding:2px 6px;border-radius:999px;font-family:var(--mono);white-space:nowrap}
.time-accum{font-family:var(--mono);font-size:9px;color:var(--muted2);margin-top:2px}

/* SLOT RIGHT SIDE */
.slot-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.slot-time{display:flex;align-items:center;gap:3px}
.time-input{width:34px;background:var(--s2);border:1px solid var(--border2);border-radius:5px;color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:500;text-align:center;padding:3px 4px;outline:none;-moz-appearance:textfield}
.time-input::-webkit-inner-spin-button,.time-input::-webkit-outer-spin-button{-webkit-appearance:none}
.time-input:focus{border-color:var(--accent)}
.time-label{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.slot-actions{display:flex;gap:3px}
.btn-icon{width:26px;height:26px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;flex-shrink:0}
.btn-icon:hover,.btn-icon:active{background:var(--s2);color:var(--text)}
.btn-icon.del:hover,.btn-icon.del:active{color:var(--red);border-color:var(--red)}
.btn-icon.sw:hover,.btn-icon.sw:active{color:var(--blue);border-color:var(--blue)}
.btn-icon.brk:hover,.btn-icon.brk:active{color:var(--accent);border-color:var(--accent)}

/* BREAK + CUSTOM */
.break-slot{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px dashed var(--border2);border-radius:var(--r-sm);user-select:none;cursor:grab;touch-action:pan-y}
.break-slot.drag-over{border-color:var(--accent)}
.break-slot.dragging{opacity:.25}
.break-slot span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.btn-remove{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:var(--font)}
.custom-slot{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;background:var(--s1);border:1px dashed var(--accent-border);border-radius:var(--r);padding:9px 10px;cursor:grab;user-select:none;touch-action:pan-y}
.custom-slot.drag-over{border-color:var(--accent)}
.custom-slot.dragging{opacity:.25}
.custom-input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-weight:600;font-family:var(--font);width:100%}
.custom-input::placeholder{color:var(--muted2)}

/* DETAIL PANEL — sidebar & accordion share */
.d-panel{padding:16px}
.d-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;color:var(--muted2);font-size:12px;text-align:center;gap:6px}
.d-empty-icon{font-size:28px;opacity:.15}
.dname{font-size:17px;font-weight:800;line-height:1.2;margin-bottom:4px}
.jugadores-badge{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.dsec{margin-bottom:14px}
.dsec-lbl{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:7px}
.dtext{font-size:13px;line-height:1.65}
.steps{display:flex;flex-direction:column;gap:5px}
.step{display:flex;gap:8px}
.step-n{font-family:var(--mono);font-size:10px;color:var(--accent);min-width:16px;flex-shrink:0;margin-top:2px}
.step-t{font-size:12px;line-height:1.5}
.prompt-card{background:var(--s2);border:1px solid var(--border2);border-radius:9px;padding:10px 11px;margin-bottom:7px}
.prompt-label{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.prompt-text{font-size:12px;line-height:1.55;color:var(--text);font-style:italic}
.prompt-why{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.prompt-note{font-size:11px;color:var(--muted);background:rgba(240,201,58,.06);border:1px solid rgba(240,201,58,.15);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.no-prompt{font-size:12px;color:var(--muted);font-style:italic}
.tips{display:flex;flex-direction:column;gap:4px}
.tip{font-size:12px;color:var(--muted);padding-left:8px;border-left:2px solid var(--border2);line-height:1.5}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center;padding:20px}}
.overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-width:560px;height:85vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--safe-b)}
@media(min-width:600px){.modal{border-radius:var(--r);height:auto;max-height:85vh}}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
@media(min-width:600px){.modal-drag{display:none}}
.modal-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h3{font-size:13px;font-weight:600}
.banner{margin:8px 10px 0;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:9px;padding:8px 10px;flex-shrink:0}
.banner-lbl{font-family:var(--mono);font-size:8px;color:var(--accent);margin-bottom:3px;letter-spacing:.07em}
.banner-why{font-size:11px;color:var(--muted);margin-bottom:5px;line-height:1.4}
.banner-quick{display:flex;gap:4px;flex-wrap:wrap}
.banner-btn{font-size:9px;padding:3px 8px;border-radius:999px;border:1px solid var(--accent-border);color:var(--accent);cursor:pointer;font-family:var(--mono);background:transparent}
.modal-search{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-search input{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:8px 10px;color:var(--text);font-size:14px;font-family:var(--font);outline:none}
.modal-search input:focus{border-color:var(--accent)}
.mfilters{padding:6px 10px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0}
.mfilters::-webkit-scrollbar{display:none}
.mfpill{padding:3px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono);white-space:nowrap;flex-shrink:0}
.mfpill.active{border-color:var(--accent);color:var(--accent)}
.mlist{overflow-y:auto;flex:1;padding:6px 8px 10px;-webkit-overflow-scrolling:touch}
.mgame{padding:8px 10px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;margin-bottom:3px}
.mgame:active{background:var(--s2);border-color:var(--border2)}
@media(hover:hover){.mgame:hover{background:var(--s2);border-color:var(--border2)}}
.mgame.sug{border-color:rgba(240,201,58,.2);background:rgba(240,201,58,.04)}
.mgame.same-type{border-color:rgba(111,180,232,.2);background:rgba(111,180,232,.04)}
.mgame.used{opacity:.25;pointer-events:none}
.mgame-name{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mgame-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:3px}
.mgame-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:999px}
.tag-sug{color:var(--accent);border:1px solid var(--accent-border)}
.tag-same{color:var(--blue);border:1px solid rgba(111,180,232,.3)}

/* PRESET MODAL */
.preset-modal{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);width:90%;max-width:340px;padding:20px;display:flex;flex-direction:column;gap:12px}
.preset-modal h3{font-size:14px;font-weight:700;margin-bottom:4px}
.preset-slot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border-radius:var(--r-sm);border:1px solid var(--border2)}
.preset-slot-name{flex:1;font-size:12px;color:var(--muted)}
.preset-slot-info{font-family:var(--mono);font-size:10px;color:var(--accent)}
.preset-slot-empty{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.btn-preset-action{padding:4px 10px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:10px;font-family:var(--mono)}
.btn-preset-action.save{border-color:var(--accent-border);color:var(--accent)}
.btn-preset-action.load{border-color:rgba(111,180,232,.3);color:var(--blue)}
.btn-preset-action.del{border-color:rgba(232,103,90,.3);color:var(--red)}
.btn-preset-close{align-self:flex-end;padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-family:var(--font)}
</style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="logo">IP</div>
    <div class="app-name">Improv Planner</div>
  </div>
  <div class="header-right">
    <div class="header-stats">
      <div class="hs"><div class="hs-n" id="sj">0</div><div class="hs-l">juegos</div></div>
      <div class="hs"><div class="hs-n" id="sm">—</div><div class="hs-l">min total</div></div>
    </div>
    <button class="btn-preset" onclick="openPresets()" title="Presets">💾 Presets</button>
  </div>
</header>

<div class="app-body">
  <main class="main">
    <!-- FILTER BAR -->
    <div class="filter-bar" id="filter-bar">
      <span class="filter-lbl">Filtrar:</span>
      <!-- filled by JS -->
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <div class="sec-lbl" style="flex:1;margin-bottom:0;min-width:120px">Playlist <span class="sec-count" id="visible-count"></span></div>
      <div class="sort-bar">
        <span class="sort-lbl">Orden:</span>
        <button class="btn-sort" id="sort-none" onclick="setPlaylistSort('none')">Original</button>
        <button class="btn-sort" id="sort-alpha" onclick="setPlaylistSort('alpha')">A–Z</button>
        <button class="btn-sort" id="sort-cat" onclick="setPlaylistSort('cat')">Tipo</button>
      </div>
    </div>
    <div id="playlist"></div>
    <div class="echart" id="echart"></div>
    <div class="add-row">
      <button class="btn-add" onclick="openPicker('add',null)">＋ Agregar juego</button>
      <button class="btn-add" onclick="addBreak(null)">⏸ Intermedio</button>
      <button class="btn-add" onclick="addCustom(null)">✎ Segmento libre</button>
    </div>
  </main>

  <!-- SIDEBAR landscape/desktop -->
  <aside class="sidebar" id="sidebar">
    <div class="d-panel" id="sidebar-content">
      <div class="d-empty" id="sidebar-empty"><div class="d-empty-icon">◎</div><div>Toca un juego para ver<br>descripción y guía</div></div>
      <div id="sidebar-detail" style="display:none"></div>
    </div>
  </aside>
</div>

<!-- PICKER MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-head"><h3 id="modal-title">Agregar juego</h3><button class="btn-icon" onclick="closeModal()" style="width:28px;height:28px">✕</button></div>
    <div id="banner-wrap"></div>
    <div class="modal-search"><input type="text" id="srch" placeholder="Buscar juego..." oninput="renderList()" autocomplete="off" spellcheck="false"></div>
    <div class="mfilters" id="mfilters"></div>
    <div class="msort-bar">
      <span class="sort-lbl" style="font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-right:2px">Orden:</span>
      <button class="btn-msort active" id="msort-alpha" onclick="setModalSort('alpha')">A–Z</button>
      <button class="btn-msort" id="msort-cat" onclick="setModalSort('cat')">Tipo</button>
    </div>
    <div class="mlist" id="mlist"></div>
  </div>
</div>

<!-- PRESETS MODAL -->
<div class="overlay" id="preset-modal">
  <div class="preset-modal">
    <h3>💾 Presets de Playlist</h3>

// ── DETAIL HTML ───────────────────────────────────────────────
function buildDetailHTML(g){
  const steps=g.pasos.map((p,i)=>`<div class="step"><div class="step-n">0${i+1}</div><div class="step-t">${p}</div></div>`).join('');
  let promptsHtml='';
  const hasPrompts=g.prompts&&g.prompts.length>0&&g.prompts.some(p=>p.label||p.texto||p.nota);
  if(!hasPrompts){
    promptsHtml=`<div class="no-prompt">Este juego no requiere sugerencia del público — el material viene del formato o del moderador.</div>`;
  } else {
    g.prompts.forEach(p=>{
      if(p.nota) promptsHtml+=`<div class="prompt-note">${p.nota}</div>`;
      else if(p.label||p.texto) promptsHtml+=`<div class="prompt-card">${p.label?`<div class="prompt-label">${p.label}</div>`:''}<div class="prompt-text">"${p.texto}"</div>${p.por?`<div class="prompt-why">${p.por}</div>`:''}</div>`;
    });
  }
  const improvHtml=g.improv&&g.improv.length>0
    ? g.improv.map(t=>`<div class="tip">${t}</div>`).join('')
    : `<div class="no-prompt">Sin sugerencias específicas registradas.</div>`;
  return `<div class="dname">${g.nombre}</div>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">${pills(g.tipos)}</div>
<div class="jugadores-badge">👥 ${g.jugadores} jugadores · <span style="display:flex;gap:2px;margin-left:4px">${epips(g.energia)}</span></div>
<div class="dsec"><div class="dsec-lbl">Descripción</div><div class="dtext">${g.desc}</div></div>
<div class="dsec"><div class="dsec-lbl">Paso a paso</div><div class="steps">${steps}</div></div>
<div class="dsec"><div class="dsec-lbl">Cómo pedir al público</div>${promptsHtml}</div>
<div class="dsec"><div class="dsec-lbl">Para los improvisadores</div><div class="tips">${improvHtml}</div></div>`;
}

// ── SIDEBAR (landscape/desktop) ───────────────────────────────
function showSidebar(g){
  document.getElementById('sidebar-empty').style.display='none';
  const sd=document.getElementById('sidebar-detail');
  sd.style.display='block';
  sd.innerHTML=`<div class="d-panel">${buildDetailHTML(g)}</div>`;
}

// ── ACCORDION (portrait mobile) ───────────────────────────────
function isPortraitMobile(){
  return window.innerWidth<768 || (window.innerWidth<1024 && window.innerHeight>window.innerWidth);
}

function toggleAccordion(idx){
  if(expandedIdx===idx){
    // collapse
    expandedIdx=null;
  } else {
    expandedIdx=idx;
  }
  // update DOM without full re-render
  document.querySelectorAll('.slot-wrap').forEach((wrap,i)=>{
    const slotEl=wrap.querySelector('.slot');
    const detailEl=wrap.querySelector('.slot-detail');
    if(!slotEl||!detailEl)return;
    const thisIdx=parseInt(wrap.dataset.wrapIdx);
    if(thisIdx===expandedIdx){
      slotEl.classList.add('selected','expanded');
      detailEl.classList.add('open');
      if(!detailEl.dataset.filled){
        const g=playlist[thisIdx]?.game;
        if(g) detailEl.querySelector('.slot-detail-inner').innerHTML=buildDetailHTML(g);
        detailEl.dataset.filled='1';
      }
    } else {
      slotEl.classList.remove('selected','expanded');
      detailEl.classList.remove('open');
    }
  });
}

// ── SELECT GAME ───────────────────────────────────────────────
function selectGame(e,idx){
  if(e.target.closest('button')||e.target.tagName==='INPUT')return;
  const item=playlist[idx];
  if(!item||item.isBreak||item.isCustom)return;
  selectedIdx=idx;
  if(isPortraitMobile()){
    toggleAccordion(idx);
  } else {
    // sidebar
    expandedIdx=null;
    showSidebar(item.game);
  }
  renderPlaylist();
}

// ── FILTER BAR ────────────────────────────────────────────────
function renderFilterBar(){
  const bar=document.getElementById('filter-bar');
  let html=`<span class="filter-lbl">Filtrar:</span>`;
  ALL_TIPOS.forEach(t=>{
    const on=activeFilters.includes(t);
    html+=`<button class="fpill${on?' active':''}" onclick="toggleFilter('${t}')">${t}</button>`;
  });
  if(activeFilters.length>0){
    html+=`<button class="filter-clear" onclick="clearFilters()">✕ Limpiar</button>`;
  }
  bar.innerHTML=html;
}

function toggleFilter(t){
  if(activeFilters.includes(t)){
    activeFilters=activeFilters.filter(f=>f!==t);
  } else {
    activeFilters.push(t);
  }
  renderFilterBar();
  applyFilters();
}

function clearFilters(){
  activeFilters=[];
  renderFilterBar();
  applyFilters();
}

function applyFilters(){
  const items=document.querySelectorAll('.slot-wrap');
  let visible=0;
  items.forEach(wrap=>{
    const idx=parseInt(wrap.dataset.wrapIdx);
    const item=playlist[idx];
    if(!item||item.isBreak||item.isCustom){
      wrap.style.display='';visible++;return;
    }
    if(activeFilters.length===0){
      wrap.style.display='';visible++;
    } else {
      const matches=item.game.tipos.some(t=>activeFilters.includes(t));
      wrap.style.display=matches?'':'none';
      if(matches)visible++;
    }
  });
  const vc=document.getElementById('visible-count');
  if(vc)vc.textContent=activeFilters.length>0?`(${visible} visibles)`:'';
}

// ── STATS ─────────────────────────────────────────────────────
function updateStats(){
  const items=playlist.filter(p=>!p.isBreak&&!p.isCustom);
  const total=playlist.reduce((s,p)=>s+(parseInt(p.mins)||0),0);
  document.getElementById('sj').textContent=items.length;
  document.getElementById('sm').textContent=total>0?total:'—';
}

function setMins(idx,val){
  if(playlist[idx])playlist[idx].mins=parseInt(val)||0;
  updateStats();
  updateAccumulators();
}

function updateAccumulators(){
  let acc=0;
  playlist.forEach((item,i)=>{
    acc+=parseInt(item.mins)||0;
    const el=document.getElementById('accum-'+i);
    if(el)el.textContent=acc>0?'acumulado: '+acc+' min':'';
  });
}

// ── SORT HELPERS ─────────────────────────────────────────────
function setPlaylistSort(mode){
  playlistSort=mode;
  ['none','alpha','cat'].forEach(m=>{
    const btn=document.getElementById('sort-'+m);
    if(btn)btn.classList.toggle('active',m===mode);
  });
  renderPlaylist();
}

function getSortedPlaylist(){
  if(playlistSort==='none')return [...playlist];
  // Separate breaks/customs from games
  const games=playlist.filter(p=>!p.isBreak&&!p.isCustom&&p.game);
  const others=playlist.filter(p=>p.isBreak||p.isCustom);
  const sorted=[...games].sort((a,b)=>{
    if(playlistSort==='alpha')return a.game.nombre.localeCompare(b.game.nombre,'es');
    if(playlistSort==='cat')return a.game.tipos[0].localeCompare(b.game.tipos[0],'es')||a.game.nombre.localeCompare(b.game.nombre,'es');
    return 0;
  });
  return [...sorted,...others];
}

function setModalSort(mode){
  modalSort=mode;
  ['alpha','cat'].forEach(m=>{
    const btn=document.getElementById('msort-'+m);
    if(btn)btn.classList.toggle('active',m===mode);
  });
  renderList();
}

// ── RENDER PLAYLIST ───────────────────────────────────────────

        <div class="custom-slot" data-idx="${i}">
          <div class="drag-handle" ontouchstart="touchStart(event,${i})" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)" onmousedown="mouseDown(event,${i})">☰</div>
          <input class="custom-input" type="text" placeholder="Nombre del segmento..." value="${item.title||''}"
            onclick="event.stopPropagation()" onchange="updateCustomTitle(${i},this.value)" oninput="updateCustomTitle(${i},this.value)"

          <div class="e-bar">${epips(g.energia)}</div>
          <div class="time-accum" id="accum-${i}">${acc>0?'acumulado: '+acc+' min':''}</div>

function renderEChart(){
  const el=document.getElementById('echart');
  const games=playlist.filter(p=>!p.isBreak&&!p.isCustom&&p.game);
  if(games.length===0){el.innerHTML='';return;}
  el.innerHTML=games.map((item,i)=>{const e=item.game.energia;const h=Math.round((e/6)*26);return`<div class="ecol"><div class="efill" style="height:${h}px;background:${ec(e)};opacity:.8"></div><div class="elbl">${i+1}</div></div>`;}).join('');
}

// ── DRAG ─────────────────────────────────────────────────────
let dragSrcIdx=null,dragGhost=null,dragOffY=0;
function getAllSlots(){return[...document.querySelectorAll('#playlist [data-idx]')];}
function getIdxAtY(y){const s=getAllSlots();for(let i=0;i<s.length;i++){const r=s[i].getBoundingClientRect();if(y<r.top+r.height/2)return parseInt(s[i].dataset.idx);}return playlist.length-1;}
function createGhost(el,cy){const r=el.getBoundingClientRect();dragOffY=cy-r.top;dragGhost=el.cloneNode(true);dragGhost.style.cssText=`position:fixed;left:${r.left}px;width:${r.width}px;opacity:0.7;pointer-events:none;z-index:999;border-radius:11px;background:var(--s3);border:1px solid var(--accent);box-shadow:0 12px 32px rgba(0,0,0,.6)`;dragGhost.style.top=(cy-dragOffY)+'px';document.body.appendChild(dragGhost);el.style.opacity='0.2';}
function moveGhost(cy){if(!dragGhost)return;dragGhost.style.top=(cy-dragOffY)+'px';}
function commitDrop(cy){if(dragSrcIdx===null)return;const ti=getIdxAtY(cy);if(ti!==dragSrcIdx){const m=playlist.splice(dragSrcIdx,1)[0];playlist.splice(ti,0,m);}cleanupDrag();renderPlaylist();}
function cleanupDrag(){if(dragGhost){dragGhost.remove();dragGhost=null;}getAllSlots().forEach(s=>{s.style.opacity='';s.classList.remove('drag-over');});dragSrcIdx=null;}
function touchStart(e,idx){if(e.target.closest('button')||e.target.tagName==='INPUT')return;e.preventDefault();dragSrcIdx=idx;const t=e.touches[0];createGhost(e.currentTarget.closest('[data-idx]'),t.clientY);}
function touchMove(e){if(dragSrcIdx===null)return;e.preventDefault();const t=e.touches[0];moveGhost(t.clientY);getAllSlots().forEach(s=>s.classList.remove('drag-over'));const ti=getIdxAtY(t.clientY);const te=document.querySelector(`[data-idx="${ti}"]`);if(te&&ti!==dragSrcIdx)te.classList.add('drag-over');}
function touchEnd(e){if(dragSrcIdx===null)return;commitDrop(e.changedTouches[0].clientY);}
let mDown=false;
function mouseDown(e,idx){if(e.target.closest('button')||e.target.tagName==='INPUT')return;e.preventDefault();dragSrcIdx=idx;mDown=true;createGhost(e.currentTarget.closest('[data-idx]'),e.clientY);document.addEventListener('mousemove',onMM);document.addEventListener('mouseup',onMU);}
function onMM(e){if(!mDown||dragSrcIdx===null)return;moveGhost(e.clientY);getAllSlots().forEach(s=>s.classList.remove('drag-over'));const ti=getIdxAtY(e.clientY);const te=document.querySelector(`[data-idx="${ti}"]`);if(te&&ti!==dragSrcIdx)te.classList.add('drag-over');}
function onMU(e){mDown=false;document.removeEventListener('mousemove',onMM);document.removeEventListener('mouseup',onMU);if(dragSrcIdx===null)return;commitDrop(e.clientY);}

function removeItem(idx){
  if(selectedIdx===idx){selectedIdx=null;document.getElementById('sidebar-empty').style.display='';document.getElementById('sidebar-detail').style.display='none';}
  if(expandedIdx===idx)expandedIdx=null;
  else if(expandedIdx>idx)expandedIdx--;
  playlist.splice(idx,1);renderPlaylist();
}
function addBreak(ai){const item={isBreak:true,mins:0};if(ai==null)playlist.push(item);else playlist.splice(ai+1,0,item);renderPlaylist();}
function addCustom(ai){const item={isCustom:true,title:'',mins:0};if(ai==null)playlist.push(item);else playlist.splice(ai+1,0,item);renderPlaylist();setTimeout(()=>{const ins=document.querySelectorAll('.custom-input');if(ins.length)ins[ins.length-1].focus();},50);}
function updateCustomTitle(idx,val){if(playlist[idx])playlist[idx].title=val;}

// ── SUGGESTION ENGINE ─────────────────────────────────────────
function buildSuggestion(contextIdx,mode){
  const pgames=playlist.filter(p=>!p.isBreak&&!p.isCustom&&p.game);
  let cg=null;
  if(mode==='add'&&contextIdx!==null){for(let i=contextIdx;i>=0;i--){if(!playlist[i]?.isBreak){cg=playlist[i].game;break;}}}
  else if(mode==='add'&&contextIdx===null&&pgames.length>0){cg=pgames[pgames.length-1].game;}
  else if(mode==='swap'){cg=playlist[swapIdx]?.game||null;}
  const used=pgames.map(p=>p.game.nombre);
  const cands=JUEGOS.filter(g=>!used.includes(g.nombre));
  if(mode==='swap'){
    const st=cg?cg.tipos[0]:null;
    const sc=cands.map(g=>{let s=0;if(st&&g.tipos.includes(st))s+=5;if(cg&&Math.abs(g.energia-cg.energia)<=1)s+=2;s+=Math.random()*.5;return{game:g,s};}).sort((a,b)=>b.s-a.s);
    return{cg,mode:'swap',recT:st?[st]:[],reason:st?`Alternativas de tipo ${st}.`:'Todos los juegos disponibles.',top:sc.slice(0,5).map(x=>x.game)};
  }
  if(!cg){return{cg:null,recT:[],reason:'Agrega un juego de apertura.',top:cands.filter(g=>g.energia>=4).slice(0,5)};}
  const rt=pgames.slice(-3).flatMap(g=>g.game.tipos);
  const tc={};rt.forEach(t=>{tc[t]=(tc[t]||0)+1;});
  const ov=Object.entries(tc).filter(([,v])=>v>=2).map(([k])=>k);
  const lt=cg.tipos;
  const recT=ALL_TIPOS.filter(t=>!lt.includes(t)&&!ov.includes(t)).slice(0,3);
  const sc=cands.map(g=>{let s=0;const sl=g.tipos.filter(t=>lt.includes(t)).length;if(sl===0)s+=4;else if(sl===1&&g.tipos.length>1)s+=1;s-=g.tipos.filter(t=>ov.includes(t)).length*3;if(Math.abs(g.energia-cg.energia)<=2)s+=2;s+=Math.random()*1.2;return{game:g,s};}).sort((a,b)=>b.s-a.s);
  return{cg,recT,reason:ov.length>0?`Después de ${cg.nombre}, hay mucho ${ov[0]}. Conviene alternar.`:`Después de ${cg.nombre} (${lt[0]}), sugerimos cambiar de tipo.`,top:sc.slice(0,5).map(x=>x.game)};
}

// ── PICKER MODAL ──────────────────────────────────────────────
function openPicker(mode,afterIdx){
  modalMode=mode;insertAfterIdx=afterIdx;mFilterTipo='todos';
  document.getElementById('srch').value='';
  document.getElementById('modal-title').textContent='Agregar juego';
  currentSug=buildSuggestion(afterIdx,mode);
  renderBanner();renderMFilters();renderList();
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('srch').focus(),200);
}
function openSwap(idx){
  modalMode='swap';swapIdx=idx;mFilterTipo='todos';
  document.getElementById('srch').value='';
  document.getElementById('modal-title').textContent=`Cambiar "${playlist[idx].game.nombre}"`;
  currentSug=buildSuggestion(idx,'swap');
  if(playlist[idx].game.tipos[0])mFilterTipo=playlist[idx].game.tipos[0];
  renderBanner();renderMFilters();renderList();
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('srch').focus(),200);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function renderBanner(){
  const w=document.getElementById('banner-wrap');
  if(!currentSug){w.innerHTML='';return;}
  const s=currentSug;
  const qb=s.recT.length>0?s.recT.map(t=>`<button class="banner-btn" onclick="setMFilter('${t}')">${t}</button>`).join(''):'';
  const tn=s.top[0]?.nombre;
  const qa=tn&&modalMode==='add'?`<button class="banner-btn" onclick="addGame('${tn.replace(/'/g,"\\'")}')">＋ ${tn}</button>`:'';
  w.innerHTML=`<div class="banner"><div class="banner-lbl">${modalMode==='swap'?'⇄ CAMBIO SUGERIDO':'▷ SUGERENCIA'}</div><div class="banner-why">${s.reason}</div>${qb||qa?`<div class="banner-quick">${qb}${qa}</div>`:''}</div>`;
}
function setMFilter(t){mFilterTipo=t;renderMFilters();renderList();}
function renderMFilters(){
  document.getElementById('mfilters').innerHTML=['todos',...ALL_TIPOS].map(t=>`<button class="mfpill${mFilterTipo===t?' active':''}" onclick="setMFilter('${t}')">${t}</button>`).join('');
}
function renderList(){
  const q=document.getElementById('srch').value.toLowerCase();
  const un=playlist.filter(p=>!p.isBreak&&!p.isCustom&&p.game).map(p=>p.game.nombre);
  const sn=modalMode==='swap'&&swapIdx!=null?playlist[swapIdx]?.game?.nombre:null;
  const sugN=currentSug?currentSug.top.map(g=>g.nombre):[];
  const swT=modalMode==='swap'&&swapIdx!=null?(playlist[swapIdx]?.game?.tipos||[]):[];

  let games=JUEGOS.filter(g=>{
    const mt=mFilterTipo==='todos'||g.tipos.includes(mFilterTipo);
    const mq=!q||g.nombre.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q)||g.tipos.some(t=>t.toLowerCase().includes(q));
    const inPlaylist=un.includes(g.nombre)&&g.nombre!==sn;
    if(modalMode==='add'&&inPlaylist)return false;
    return mt&&mq;
  });

  games.sort((a,b)=>{
    if(modalMode==='swap'){
      const as=sugN.includes(a.nombre),bs=sugN.includes(b.nombre);
      if(as&&!bs)return-1;if(!as&&bs)return 1;
    }
    if(modalSort==='alpha')return a.nombre.localeCompare(b.nombre,'es');
    if(modalSort==='cat')return a.tipos[0].localeCompare(b.tipos[0],'es')||a.nombre.localeCompare(b.nombre,'es');
    return 0;
  });

  const el=document.getElementById('mlist');
  if(games.length===0){el.innerHTML='<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">No hay juegos que coincidan</div>';return;}
  el.innerHTML=games.map(g=>{
    const isSug=sugN.includes(g.nombre);
    const isSame=modalMode==='swap'&&swT.length>0&&g.tipos.some(t=>swT.includes(t))&&!isSug;
    let cls='mgame';if(isSug)cls+=' sug';else if(isSame)cls+=' same-type';
    const tg=isSug?'<span class="tag tag-sug">sugerido</span>':isSame?'<span class="tag tag-same">mismo tipo</span>':'';
    const ne=g.nombre.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="${cls}" onclick="doAction('${ne}')">`
      +`<div class="mgame-name">${g.nombre}${tg}</div>`
      +`<div class="mgame-desc">${g.desc.substring(0,80)}…</div>`
      +`<div class="mgame-meta">${pills(g.tipos)}<div class="e-bar" style="margin:0">${epips(g.energia,true)}</div></div>`
      +'</div>';
  }).join('');
}
function doAction(n){if(modalMode==='add')addGame(n);else swapGame(n);}
function addGame(nombre){
  const g=JUEGOS.find(j=>j.nombre===nombre);if(!g)return;
  const item={game:g,porQue:'',mins:0};
  if(insertAfterIdx==null)playlist.push(item);else playlist.splice(insertAfterIdx+1,0,item);
  closeModal();renderPlaylist();
}
function swapGame(nombre){
  const g=JUEGOS.find(j=>j.nombre===nombre);if(!g||swapIdx==null)return;
  playlist[swapIdx]={game:g,porQue:playlist[swapIdx].porQue||'',mins:playlist[swapIdx].mins||0};
  if(selectedIdx===swapIdx)showSidebar(g);
  closeModal();renderPlaylist();
}

// ── PRESETS ───────────────────────────────────────────────────
function serializePlaylist(){
  return playlist.map(p=>{
    if(p.isBreak)return{isBreak:true,mins:p.mins||0};
    if(p.isCustom)return{isCustom:true,title:p.title||'',mins:p.mins||0};
    return{nombre:p.game.nombre,porQue:p.porQue||'',mins:p.mins||0};
  });
}

function deserializePlaylist(data){
  return data.map(p=>{
    if(p.isBreak)return{isBreak:true,mins:p.mins||0};
    if(p.isCustom)return{isCustom:true,title:p.title||'',mins:p.mins||0};
    const g=JUEGOS.find(j=>j.nombre===p.nombre);
    if(!g)return null;
    return{game:g,porQue:p.porQue||'',mins:p.mins||0};
  }).filter(Boolean);
}

function savePreset(n){
  if(playlist.length===0){alert('El playlist está vacío.');return;}
  const data=serializePlaylist();
  localStorage.setItem(`preset_${n}`,JSON.stringify(data));
  renderPresetSlots();
}

function loadPreset(n){
  const raw=localStorage.getItem(`preset_${n}`);
  if(!raw){alert('Este preset está vacío.');return;}
  try{
    playlist=deserializePlaylist(JSON.parse(raw));
    selectedIdx=null;expandedIdx=null;
    closePresets();
    renderPlaylist();
  }catch(e){alert('Error al cargar el preset.');}
}

function deletePreset(n){
  localStorage.removeItem(`preset_${n}`);
  renderPresetSlots();
}

function openPresets(){
  renderPresetSlots();
  document.getElementById('preset-modal').classList.add('open');
}
function closePresets(){document.getElementById('preset-modal').classList.remove('open');}
document.getElementById('preset-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closePresets();});

function renderPresetSlots(){
  const el=document.getElementById('preset-slots');
  let html='';
  [1,2,3].forEach(n=>{
    const raw=localStorage.getItem(`preset_${n}`);
    let info='',hasData=false;
    if(raw){
      try{
        const d=JSON.parse(raw);
        const games=d.filter(p=>!p.isBreak&&!p.isCustom).length;
        const mins=d.reduce((s,p)=>s+(p.mins||0),0);
        info=`${games} juegos${mins>0?' · '+mins+' min':''}`;
        hasData=true;
      }catch(e){}
    }
    html+=`<div class="preset-slot">
      <div style="flex:1">
        <div style="font-family:var(--mono);font-size:10px;color:var(--muted2);margin-bottom:2px">Preset ${n}</div>
        ${hasData?`<div class="preset-slot-info">${info}</div>`:`<div class="preset-slot-empty">Vacío</div>`}
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn-preset-action save" onclick="savePreset(${n})">Guardar</button>
        ${hasData?`<button class="btn-preset-action load" onclick="loadPreset(${n})">Cargar</button>`:''}
        ${hasData?`<button class="btn-preset-action del" onclick="deletePreset(${n})">✕</button>`:''}
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

// ── ORIENTATION CHANGE ────────────────────────────────────────
window.addEventListener('orientationchange',()=>{
  setTimeout(()=>{
    if(!isPortraitMobile()&&expandedIdx!==null){
      // switched to landscape — show sidebar instead
      const g=playlist[expandedIdx]?.game;
      if(g)showSidebar(g);
      expandedIdx=null;
      renderPlaylist();
    }
  },100);
});

// ── INIT ─────────────────────────────────────────────────────
// Shuffle all games randomly on load
const shuffled=[...JUEGOS].sort(()=>Math.random()-.5);
shuffled.forEach(g=>{playlist.push({game:g,porQue:'',mins:0});});
renderFilterBar();
renderPlaylist();
</script>
